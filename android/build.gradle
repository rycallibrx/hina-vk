// Top-level build file for HinaVK Android examples

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.0'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

ext {
    // Build configuration
    compileSdkVersion = 34
    minSdkVersion = 24  // Vulkan requires API 24+
    targetSdkVersion = 34
    ndkVersion = "25.2.9519653"

    // ABI filter - arm64-v8a is the primary target for modern devices
    abiFilters = ["arm64-v8a"]

    // Paths relative to android/ directory
    rootDir = project.rootDir.parentFile
    srcDir = "${rootDir}/src"
    examplesDir = "${rootDir}/examples"
    thirdPartyDir = "${rootDir}/third_party"

    // Shared jniLibs (validation layers, etc.)
    sharedJniLibsDir = "${project.rootDir}/shared/jniLibs"
}

// Configure all example subprojects to use shared jniLibs
subprojects {
    afterEvaluate {
        if (it.hasProperty('android')) {
            android {
                sourceSets {
                    main {
                        jniLibs.srcDirs += rootProject.ext.sharedJniLibsDir
                    }
                }
            }
        }
    }
}
